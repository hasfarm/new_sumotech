<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cấu hình - SumoTech Video Pipeline</title>
<style>
    body { font-family: system-ui, sans-serif; padding: 18px; width: 360px; color: #1f2937; }
    h3 { margin: 0 0 12px; font-size: 15px; }
    label { display: block; margin-top: 12px; font-size: 13px; color: #4b5563; }
    input { width: 100%; padding: 7px; margin-top: 4px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    button { margin-top: 16px; padding: 8px 16px; background: #7c3aed; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #6d28d9; }
    #status { margin-top: 10px; font-size: 12px; color: #059669; min-height: 16px; }
    .hint { font-size: 11px; color: #9ca3af; margin-top: 4px; }
</style>
</head>
<body>
<h3>⚙️ Cấu hình SumoTech Video Pipeline</h3>
<label>App base URL
    <input type="text" id="baseUrl" placeholder="http://sumotech.test">
</label>
<div class="hint">Sửa lại nếu app chạy ở địa chỉ khác.</div>

<label>API Token
    <input type="password" id="token" placeholder="Dán token từ nút 'Lấy token cho Extension' trong trang Video Pipeline">
</label>
<div class="hint">Vào trang Video Pipeline của 1 cuốn sách → bấm "🧩 Lấy token cho Extension" → copy vào đây.</div>

<button id="save">Lưu</button>
<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
